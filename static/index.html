<script>
// Pre-fetch paper list in parallel with app.js download.
// Results are stashed in window.__initialData__ for the app to consume on boot.
(function(){
  var path = window.location.pathname;
  if (path !== '/' && path !== '/index.html' && !path.startsWith('/?')) return;
  const params = new URLSearchParams(window.location.search);
  const qs = new URLSearchParams(params);
  qs.set('page', params.get('page') || '1');
  qs.set('page_size', '10');
  window.__initialData__ = fetch('/api/papers?' + qs.toString())
    .then(function(r){ return r.json(); })
    .catch(function(){ return null; });
})();
